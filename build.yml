name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build editor
        shell: pwsh
        run: |
          msbuild "HandyHwanseEditor_EquipmentResearch_Source/HandyHwanseEditor.csproj" /restore /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HandyHwanseEditor-Checkbox-Windows
          path: |
            HandyHwanseEditor_EquipmentResearch_Source/bin/Release/HandyHwanseEditor.exe
            HandyHwanseEditor_EquipmentResearch_Source/bin/Release/HandyHwanseEditor.exe.config
          if-no-files-found: error
